<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Healthcare Risk Factor Analysis - Data Analytics Capstone Project">
  <title>{% block title %}Smart Healthcare Analysis{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="brand-mark">+</span>
      <span>Health<span class="brand-light">360</span></span>
    </a>
    <button class="menu-toggle" aria-label="Toggle navigation" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
    <div class="nav-links">
      <a href="{{ url_for('home') }}" class="{% if request.endpoint == 'home' %}active{% endif %}">Home</a>
      <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('story') }}" class="{% if request.endpoint == 'story' %}active{% endif %}">Data Story</a>
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer class="footer">
    <div>
      <a class="brand footer-brand" href="{{ url_for('home') }}"><span class="brand-mark">+</span> Health<span class="brand-light">360</span></a>
      <p>Smart Healthcare Risk Factor Analysis</p>
      <p class="creator-credit">Created and developed by <strong>Kriti Bhandari</strong></p>
    </div>
    <p class="footer-note">Data Analytics Capstone Project · Tableau Public<br>Website by <strong>Kriti Bhandari</strong></p>
  </footer>
</body>
</html>
